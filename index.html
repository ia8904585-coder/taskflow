<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">
</head>
<body>

  <!-- ===== الشريط العلوي ===== -->
  <header class="topbar">
    <h1 class="logo">TaskFlow</h1>
    <p class="today" id="today-date"></p>
  </header>

  <main class="container">

    <!-- ===== جدول المحاضرات ===== -->
    <section class="card" id="lectures-section">
      <div class="card-head">
        <h2>جدول المحاضرات</h2>
        <button type="button" class="btn" id="add-lecture-btn">+ إضافة محاضرة</button>
      </div>

      <!-- نموذج إضافة محاضرة (يمكنك إخفاؤه وإظهاره بـ JavaScript) -->
      <form class="form" id="lecture-form">
        <input type="text" id="lecture-subject" name="subject" placeholder="اسم المادة" required>
        <select id="lecture-day" name="day">
        <option value="الأحد">الأحد</option>
<option value="الاثنين">الاثنين</option>
<option value="الثلاثاء">الثلاثاء</option>
<option value="الأربعاء">الأربعاء</option>
<option value="الخميس">الخميس</option>
<option value="الجمعة">الجمعة</option>
<option value="السبت">السبت</option>
        </select>
        <input type="time" id="lecture-start" name="start" aria-label="وقت البداية">
        <input type="time" id="lecture-end" name="end" aria-label="وقت النهاية">
        <input type="text" id="lecture-room" name="room" placeholder="القاعة">
        <button type="button" class="btn" id="save-lecture-btn">حفظ</button>
      </form>

      <div class="table-wrap">
        <table class="table" id="lectures-table">
          <thead>
            <tr>
              <th>اليوم</th>
              <th>الوقت</th>
              <th>المادة</th>
              <th>القاعة</th>
              <th><span class="sr-only">إجراءات</span></th>
            </tr>
          </thead>
          <!-- كل صف محاضرة له بنية موحدة -->
          <tbody id="lecture-list">
           
          </tbody>
        </table>
      </div>
    </section>

    <!-- ===== المهام ===== -->
    <section class="card" id="tasks-section">
      <div class="card-head">
        <h2>المهام</h2>
      <!--   <p class="muted"><span id="completed-count">1</span> من <span id="task-count">3</span> مكتملة</p> -->
      </div>

      <form class="form" id="task-form">
        <input type="text" id="task-title" name="title" placeholder="مهمة جديدة..." required>
        <input type="date" id="task-date" name="date" aria-label="التاريخ">
        <input type="time" id="task-time" name="time" aria-label="الوقت">
        <select id="task-priority" name="priority" aria-label="الأولوية">
          <option value="مرتفعة">مرتفعة</option>
          <option value="متوسطة" selected>متوسطة</option>
          <option value="منخفضة">منخفضة</option>
        </select>
        <select id="task-category" name="category" aria-label="التصنيف">
          <option value=">الدراسة">الدراسة</option>
          <option value="العمل">العمل</option>
          <option value="شخصي">شخصي</option>
        </select>
        <button type="submit" class="btn" id="add-task-btn">إضافة</button>
      </form>

      <ul class="task-list" id="task-list">
      
      </ul>
    </section>

  </main>
  <script src="cood.js"></script>
</body>
</html>
